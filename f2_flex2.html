<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="Author" content="Sneha">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlapping Circles</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    background:#0f766e;
    padding-top:50px;
}

.container{
    width:90%;
    max-width:800px;
    height:450px;
    background:#fef3c7;

    display:flex;
    justify-content:center;
    align-items:center;
}

.circles{
    display:flex;
}

/* Each circle is made round using border-radius */
.circle{
    width:180px;
    height:180px;
    border:4px solid #134e4a;
    border-radius:50%;
    background:transparent;
}

/* Negative margin makes the circles overlap */
#c2{
    margin-left:-90px;
}

#c3{
    margin-left:-90px;
}

</style>

</head>

<body>

<div class="container">

    <div class="circles">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
        <div class="circle" id="c3"></div>
    </div>

</div>

</body>
</html>
