<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="Author" content="Sneha">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Row Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    background-color:#1e293b;
}

.container{
    width:100%;
    min-height:100vh;
    border:2px solid #0f172a;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.row{
    display:flex;
    justify-content:center;
    gap:20px;
    width:100%;
}

/* Basic styling shared by all boxes */
.box{
    width:180px;
    height:100px;
    background-color:#f4a261;
    border-radius:10px;
}

@media (max-width:768px){

    .container{
        width:100%;
        min-height:100vh;
        padding:20px;
    }

    /* Stack the boxes vertically on smaller screens */
    .row{
        flex-direction:column;
        align-items:center;
    }

    .box{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="row">
        <div class="box"></div>
    </div>

    <div class="row">
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="row">
        <div class="box"></div>
    </div>

</div>

</body>
</html>
