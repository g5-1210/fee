<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="Author" content="Sneha">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Page Layout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-size:larger;
}

.container{
    display:grid;
    height:100vh;
    grid-template-rows:80px auto 60px;
    grid-template-columns:50% 50%;
    background-color:#F7F3ED;
}

/* Header section is spread across both columns */
header{
    background-color:#293241;
    color:#F7F3ED;
    display:flex;
    align-items:center;
    grid-column:1 / -1;
}

header div{
    flex:1;
    padding:20px;
}

.logo{
    text-align:left;
    border-right:2px solid #98A886;
}

.links{
    text-align:right;
}

/* First main section */
main1{
    background-color:#E9E5DC;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #98A886;
    color:#293241;
}

/* Second main section */
.main2{
    background-color:#F7F3ED;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #98A886;
    color:#293241;
}

/* Footer section also covers both columns */
footer{
    background-color:#293241;
    color:#F7F3ED;
    display:flex;
    align-items:center;
    grid-column:1 / -1;
}

footer div{
    flex:1;
    padding:15px 20px;
}

.footer1{
    text-align:left;
    border-right:2px solid #98A886;
}

.footer2{
    text-align:right;
}

</style>

</head>

<body>

<div class="container">

    <header>
        <div class="logo">Logo</div>
        <div class="links">Links</div>
    </header>

    <main1>
        Main 1
    </main1>

    <div class="main2">
        Main 2
    </div>

    <footer>
        <div class="footer1">Footer 1</div>
        <div class="footer2">Footer 2</div>
    </footer>

</div>

</body>
</html>
