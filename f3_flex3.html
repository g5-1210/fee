<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="Author" content="Sneha">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four Boxes Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#1e293b;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    padding:40px 20px;
}

.flex-layout{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    max-width:420px;
    margin:auto;
}

/* Common styling for all four boxes */
.box{
    width:180px;
    height:100px;
    background:#f4a261;
    border-radius:10px;
}

@media (max-width:768px){

    .container{
        padding:20px;
    }

    /* Boxes are stacked on smaller screens */
    .flex-layout{
        flex-direction:column;
        align-items:center;
        max-width:100%;
    }

    .box{
        width:90%;
        max-width:350px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="flex-layout">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</div>

</body>
</html>
