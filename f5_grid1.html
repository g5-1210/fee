<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Sneha">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Grid Layout</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100dvh;
            font-family:Arial, sans-serif;
            font-size:16px;
            background-color:#DCE7F0;
            color:#183B4E;
        }

        .Box{
            background-color:#2F6690;
            color:white;
            padding:1rem;
        }

        .gc{
            height:80vh;
            display:grid;
            gap:0.5rem;
            place-content:center;
            padding:20px;
            background-color:#DCE7F0;
        }

        /* Different grid areas create the bento-style arrangement */
        #m1{
            grid-column:1 / 4;
            grid-row:1 / 2;
            background-color:#3A7CA5;
        }

        #m2{
            grid-column:4 / 5;
            grid-row:1 / 4;
            background-color:#2F6690;
        }

        #m3{
            grid-column:1 / 2;
            grid-row:2 / 5;
            background-color:#4D908E;
        }

        #m4{
            grid-column:2 / 4;
            grid-row:2 / 4;
            background-color:#3A7CA5;
        }

        #m5{
            grid-column:2 / 5;
            grid-row:4 / 5;
            background-color:#E07A5F;
        }


        /* DESKTOP / BENTO LAYOUT */

        @media (min-width:767px){

            .gc{
                grid-template-columns:repeat(4, 180px);
                grid-template-rows:repeat(4, minmax(0, 1fr));
            }
        }


        /* MOBILE / STACKED LAYOUT */

        @media (max-width:766px){

            .gc{
                grid-template-columns:1fr;
                grid-template-rows:repeat(5, minmax(0, 1fr));
                gap:10px;
                place-content:center;
                padding:20px;
            }

            #m1,
            #m2,
            #m3,
            #m4,
            #m5{
                grid-column:auto;
                grid-row:auto;
            }
        }

    </style>
</head>

<body>

    <section class="Box" style="height:10vh">
        <span style="font-size:2.5rem; margin-right:1rem">&#9812;</span>
        Header/Navbar
    </section>

    <section class="Box gc">

        <main class="Box" id="m1">Content 1</main>
        <main class="Box" id="m2">Content 2</main>
        <main class="Box" id="m3">Content 3</main>
        <main class="Box" id="m4">Content 4</main>
        <main class="Box" id="m5">Content 5</main>

    </section>

    <section class="Box" style="height:10vh">
        <span style="font-size:2.5rem; margin-right:1rem">&#9776;</span>
        Footer
    </section>

</body>
</html>
